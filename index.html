<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BioSci Brief — Katalog Jurnal Interaktif</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 2rem 1rem;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 2rem;
    }
    header h1 {
      font-size: 1.85rem;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
    }
    header p {
      color: var(--muted);
      font-size: 0.95rem;
    }
    .search-box {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      outline: none;
    }
    .search-box:focus {
      border-color: var(--accent);
    }
    .grid {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s ease, border-color 0.15s ease;
      display: block;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }
    .meta {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.5rem;
      font-size: 0.8rem;
    }
    .tag {
      background: #e0f2fe;
      color: var(--accent-hover);
      padding: 0.15rem 0.6rem;
      border-radius: 999px;
      font-weight: 600;
    }
    .date {
      color: var(--muted);
    }
    .card h2 {
      font-size: 1.15rem;
      margin-bottom: 0.35rem;
    }
    .card p {
      font-size: 0.9rem;
      color: var(--muted);
    }
    footer {
      text-align: center;
      margin-top: 2.5rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>BioSci Brief</h1>
      <p>Ringkasan interaktif harian jurnal biologi, genetika, dan medis.</p>
    </header>

    <input type="text" id="search" class="search-box" placeholder="Cari topik atau judul jurnal..." />

    <div class="grid" id="journal-list">
      <!-- TAMBAHKAN JURNAL BARU DI BAWAH BARIS INI (COPY-PASTE BLOK <a ...> ... </a>) -->

      <a class="card" href="tirzepatide-2024">
        <div class="meta">
          <span class="tag">Biologi Kesehatan</span>
          <span class="date">2024</span>
        </div>
        <h2>Tirzepatide untuk Apnea Tidur Obstruktif & Obesitas</h2>
        <p>Eksplorasi data klinis, mekanisme kerja agonis GIP/GLP-1, simulasi visual, dan kuis singkat.</p>
      </a>

      <!-- BATAS AKHIR DAFTAR JURNAL -->
    </div>

    <footer>
      &copy; 2026 BioSci Brief • Dihosting di GitHub Pages
    </footer>
  </div>

  <script>
    const searchInput = document.getElementById('search');
    const cards = document.querySelectorAll('.card');
    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      cards.forEach(card => {
        const text = card.innerText.toLowerCase();
        card.style.display = text.includes(q) ? 'block' : 'none';
      });
    });
  </script>
</body>
</html>

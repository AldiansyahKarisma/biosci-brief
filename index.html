<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BioSci Brief — Katalog Jurnal Interaktif</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 2rem 1rem;
    }
    .container { max-width: 720px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 2rem; }
    header h1 { font-size: 1.85rem; letter-spacing: -0.02em; margin-bottom: 0.4rem; }
    header p { color: var(--muted); font-size: 0.95rem; }
    .search-box {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      outline: none;
    }
    .search-box:focus { border-color: var(--accent); }
    .grid { display: flex; flex-direction: column; gap: 1rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s ease, border-color 0.15s ease;
      display: block;
    }
    .card:hover { transform: translateY(-2px); border-color: var(--accent); }
    .meta {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.5rem;
      font-size: 0.8rem;
    }
    .tag {
      background: #e0f2fe;
      color: var(--accent-hover);
      padding: 0.15rem 0.6rem;
      border-radius: 999px;
      font-weight: 600;
    }
    .card h2 { font-size: 1.15rem; margin-bottom: 0.35rem; }
    .card p { font-size: 0.9rem; color: var(--muted); }
    .status { text-align: center; color: var(--muted); padding: 2rem 0; font-size: 0.95rem; }
    footer { text-align: center; margin-top: 2.5rem; font-size: 0.8rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>BioSci Brief</h1>
      <p>Ringkasan interaktif harian jurnal biologi, genetika, dan medis.</p>
    </header>

    <input type="text" id="search" class="search-box" placeholder="Cari topik atau judul jurnal..." />

    <div class="grid" id="journal-list">
      <div class="status">Memuat daftar jurnal...</div>
    </div>

    <footer>
      &copy; 2026 BioSci Brief • Dihosting di GitHub Pages
    </footer>
  </div>

  <script>
    const USERNAME = "AldiansyahKarisma";
    const REPO = "biosci-brief";
    const listEl = document.getElementById("journal-list");
    const searchInput = document.getElementById("search");

    function formatFilename(filename) {
      return filename
        .replace(/\.html$/i, "")
        .replace(/[-_]+/g, " ")
        .replace(/\b\w/g, c => c.toUpperCase());
    }

    async function extractMeta(fileUrl, fallbackTitle) {
      try {
        const res = await fetch(fileUrl);
        if (!res.ok) return { title: fallbackTitle, desc: "Buka halaman interaktif untuk eksplorasi data, mekanisme, dan kuis singkat." };
        const html = await res.text();
        const doc = new DOMParser().parseFromString(html, "text/html");
        const title = doc.querySelector("title")?.textContent?.trim() || fallbackTitle;
        const desc = doc.querySelector('meta[name="description"]')?.getAttribute("content")?.trim()
          || "Buka halaman interaktif untuk eksplorasi data, mekanisme, dan kuis singkat.";
        return { title, desc };
      } catch {
        return { title: fallbackTitle, desc: "Buka halaman interaktif untuk eksplorasi data, mekanisme, dan kuis singkat." };
      }
    }

    async function loadJournals() {
      try {
        const res = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/contents/`);
        if (!res.ok) throw new Error("Gagal mengambil daftar file.");
        const files = await res.json();

        const htmlFiles = files
          .filter(f => f.type === "file" && f.name.endsWith(".html") && f.name.toLowerCase() !== "index.html")
          .reverse();

        if (htmlFiles.length === 0) {
          listEl.innerHTML = '<div class="status">Belum ada jurnal yang diunggah.</div>';
          return;
        }

        const items = await Promise.all(htmlFiles.map(async file => {
          const slug = file.name.replace(/\.html$/i, "");
          const meta = await extractMeta(file.name, formatFilename(file.name));
          return { slug, ...meta };
        }));

        listEl.innerHTML = items.map(item => `
          <a class="card" href="${item.slug}">
            <div class="meta">
              <span class="tag">Jurnal Interaktif</span>
            </div>
            <h2>${item.title}</h2>
            <p>${item.desc}</p>
          </a>
        `).join("");
      } catch (err) {
        listEl.innerHTML = '<div class="status">Gagal memuat daftar jurnal. Coba muat ulang halaman.</div>';
      }
    }

    searchInput.addEventListener("input", (e) => {
      const q = e.target.value.toLowerCase();
      document.querySelectorAll(".card").forEach(card => {
        card.style.display = card.innerText.toLowerCase().includes(q) ? "block" : "none";
      });
    });

    loadJournals();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BioSci Brief — Katalog Jurnal Interaktif</title>
  <style>
    :root {
      --bg: #f0fdf9;
      --card: rgba(255, 255, 255, 0.92);
      --text: #0f172a;
      --muted: #475569;
      --primary: #0d9488;
      --primary-dark: #0f766e;
      --border: #cbd5e1;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #ecfeff 0%, #f0fdf4 50%, #fdf4ff 100%);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      padding: 2rem 1rem 3.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Latar Animasi Biologi (10 Ikon) */
    .bio-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .bio-float {
      position: absolute;
      opacity: 0.28;
      animation: floatBio 14s ease-in-out infinite;
    }

    .bio-float.f1  { top: 5%; left: 3%; width: 96px; color: #0d9488; animation-delay: 0s; }
    .bio-float.f2  { top: 14%; right: 4%; width: 92px; color: #16a34a; animation-delay: -3s; animation-duration: 16s; }
    .bio-float.f3  { top: 44%; left: 2%; width: 88px; color: #ec4899; animation-delay: -6s; animation-duration: 18s; }
    .bio-float.f4  { bottom: 18%; right: 5%; width: 94px; color: #0284c7; animation-delay: -2s; animation-duration: 15s; }
    .bio-float.f5  { bottom: 6%; left: 8%; width: 90px; color: #f59e0b; animation-delay: -8s; animation-duration: 17s; }
    .bio-float.f6  { top: 34%; right: 9%; width: 82px; color: #8b5cf6; animation-delay: -5s; animation-duration: 19s; }
    .bio-float.f7  { top: 24%; left: 10%; width: 86px; color: #f97316; animation-delay: -4s; animation-duration: 15s; }
    .bio-float.f8  { bottom: 32%; left: 6%; width: 98px; color: #06b6d4; animation-delay: -7s; animation-duration: 20s; }
    .bio-float.f9  { top: 62%; right: 3%; width: 84px; color: #d946ef; animation-delay: -1s; animation-duration: 16s; }
    .bio-float.f10 { bottom: 5%; right: 14%; width: 88px; color: #10b981; animation-delay: -9s; animation-duration: 17s; }

    @keyframes floatBio {
      0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
      50% { transform: translateY(-28px) rotate(14deg) scale(1.08); }
    }

    @media (max-width: 640px) {
      .bio-float { opacity: 0.18; transform: scale(0.8); }
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .brand-pill {
      display: inline-block;
      background: linear-gradient(90deg, #0d9488, #0284c7);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 0.28rem 0.85rem;
      border-radius: 999px;
      margin-bottom: 0.6rem;
    }

    header h1 {
      font-size: clamp(1.9rem, 4vw, 2.4rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(90deg, #0f766e, #0369a1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.4rem;
    }

    header p {
      color: var(--muted);
      font-size: 0.96rem;
    }

    .search-wrap {
      margin-bottom: 1rem;
    }

    .search-box {
      width: 100%;
      padding: 0.85rem 1.15rem;
      border: 1.5px solid #cbd5e1;
      border-radius: 14px;
      font-size: 0.95rem;
      background: rgba(255, 255, 255, 0.95);
      outline: none;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box:focus {
      border-color: var(--primary);
      box-shadow: 0 4px 18px rgba(13, 148, 136, 0.14);
    }

    .category-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.4rem;
      justify-content: center;
    }

    .cat-btn {
      padding: 0.48rem 0.95rem;
      border-radius: 999px;
      border: 1.5px solid #cbd5e1;
      background: rgba(255, 255, 255, 0.9);
      color: var(--muted);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .cat-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .cat-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(13, 148, 136, 0.22);
    }

    .cat-count {
      background: rgba(15, 23, 42, 0.08);
      padding: 0.05rem 0.45rem;
      border-radius: 999px;
      font-size: 0.75rem;
    }

    .cat-btn.active .cat-count {
      background: rgba(255, 255, 255, 0.25);
      color: #ffffff;
    }

    .grid {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(8px);
      border: 1.5px solid rgba(203, 213, 225, 0.8);
      border-radius: var(--radius);
      padding: 1.25rem 1.35rem;
      text-decoration: none;
      color: inherit;
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
      display: block;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.03);
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: var(--primary);
      box-shadow: 0 10px 24px rgba(13, 148, 136, 0.12);
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.55rem;
      font-size: 0.78rem;
    }

    .tag {
      padding: 0.18rem 0.68rem;
      border-radius: 999px;
      font-weight: 700;
    }

    .tag-kesehatan { background: #ccfbf1; color: #0f766e; }
    .tag-zoologi   { background: #fef3c7; color: #b45309; }
    .tag-botani    { background: #dcfce7; color: #15803d; }
    .tag-mikrob    { background: #f3e8ff; color: #7e22ce; }

    .date-badge {
      background: #e0f2fe;
      color: #0369a1;
      padding: 0.18rem 0.65rem;
      border-radius: 999px;
      font-weight: 600;
    }

    .card h2 {
      font-size: 1.15rem;
      line-height: 1.35;
      margin-bottom: 0.35rem;
      color: #0f172a;
    }

    .card p {
      font-size: 0.9rem;
      color: var(--muted);
    }

    .status {
      text-align: center;
      color: var(--muted);
      padding: 2.5rem 1
